# Continuous integration.
#
# Nothing here depends on `sim/public/scenes/` (gitignored, ~900 MB) or on the
# network: `npm run selftest:ci` runs in ~2 min, and the tests that need an
# installed scene bow out on their own by reporting SKIP.
#
# It is the same command .github/workflows/release.yml runs before publishing a
# tag: what ships as a version has passed exactly these checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that supersedes another on the same branch cancels the previous job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    # Windows never ran this repository before the desktop app existed: the
    # matrix is there to flush out paths, separators and locales before a
    # player finds them.
    name: sim — selftests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sim/package-lock.json

      - run: npm ci

      - name: Selftests (no browser, no scene, no network)
        run: npm run selftest:ci

      - name: Build
        run: npm run build
