# Publishing a version.
#
# Triggered by pushing a `vX.Y.Z` tag (optional pre-release suffix,
# `vX.Y.Z-beta`) — the one `npm run release` created.
# The job refuses to publish if the tag and sim/package.json do not say the same
# number: that is the guard against a tag placed by hand on the wrong commit.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    name: release — selftests, archive and GitHub Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sim/package-lock.json

      - name: The tag and sim/package.json say the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} against version ${pkg} in sim/package.json"
            exit 1
          fi

      - run: npm ci

      - name: Selftests (no browser, no scene, no network)
        run: npm run selftest:ci

      - name: Build
        run: npm run build

      - name: Release notes, taken from the CHANGELOG
        run: node tools/release-notes.mjs "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      # The archive deploy/deploy.sh installs on the VPS. `dist` alone does not
      # start: server/api.mjs imports tools/lib/*, tools/*.mjs and
      # src/geofence.js. The server, on the other hand, needs NO npm package at
      # all (checked: it boots without node_modules), so nothing is installed on
      # the VPS — hence the deliberate absence of node_modules here.
      #
      # The Node runtime travels with it: fpvtp.service runs
      # /opt/fpvtp/current/node/bin/node, and a ProtectSystem=strict unit must
      # not depend on whichever version the distribution offers that day. We
      # take EXACTLY the one that just passed the selftests.
      - name: Server archive, for self-hosting
        run: |
          set -euo pipefail
          v="$(node -p 'process.version')"
          stage="${RUNNER_TEMP}/bundle"
          mkdir -p "${stage}/app" "${stage}/node"
          cp -r server tools src package.json "${stage}/app/"
          cp -r dist "${stage}/app/"
          # Everything needed to install the thing without coming back to the
          # repository: the systemd unit, the Caddyfile, deploy.sh and its
          # human checklist.
          cp -r ../deploy "${stage}/deploy"
          # The AGPL requires the licence to accompany the program being
          # distributed. This is not decorative: without it the archive is not
          # compliant.
          cp ../LICENSE "${stage}/LICENSE"
          curl -fsSL "https://nodejs.org/dist/${v}/node-${v}-linux-x64.tar.xz" -o "${RUNNER_TEMP}/node.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${stage}/node" --strip-components=1
          # The embedded runtime must start THE server, not merely announce
          # itself: we make it resolve the paths before sealing the archive. An
          # archive that does not start must not be published.
          "${stage}/node/bin/node" --version
          "${stage}/node/bin/node" "${stage}/app/server/index.mjs" --help > /dev/null
          tar -czf "${RUNNER_TEMP}/fpvtp-server-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C "${stage}" app node deploy LICENSE

      # What the Release contains, written into its body: without this nobody
      # knows which of the files to download.
      - name: Append the file inventory to the notes
        run: |
          cat >> "${RUNNER_TEMP}/notes.md" <<'NOTES'

          ---

          ## Which file do I download?

          | File | For whom |
          |---|---|
          | `FPVTP-*-win-x64.exe` | **Play on Windows.** Installer: Start Menu entry, uninstaller, automatic updates. It is not code-signed, so SmartScreen warns on first launch. |
          | `FPVTP-*-linux-x86_64.AppImage` | **Play on Linux.** Make it executable, double-click. Automatic updates. |
          | `fpvtp-server-*-linux-x64.tar.gz` | **Host an instance.** The server, the built game, a Node runtime and `deploy/` (systemd unit, Caddyfile, delivery script, checklist). No `npm install` to run. |
          | `latest.yml`, `latest-linux.yml`, `*.blockmap` | Update plumbing, read by the installed app. Not meant to be downloaded by hand. |

          There is no macOS build.

          To play: take the one file for your system, that is the whole install.

          To host: unpack, then follow `deploy/README.md`. The server listens on
          `127.0.0.1` and refuses to listen wider without `--mode shared`, which
          then demands an operator key on every API request.

          The game is under [AGPL-3.0](LICENSE): if you host a modified version
          for other people, you must publish its sources to them.
          NOTES

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            "${RUNNER_TEMP}/fpvtp-server-${GITHUB_REF_NAME}-linux-x64.tar.gz"

  # The installed app. Each platform builds on its own runner: the native
  # binaries (sharp/libvips) are those of the system that installs them, and
  # cross-compiling from Linux would embed Linux .so files in the Windows
  # installer.
  #
  # Nothing is pushed to a server of ours here, and nothing needs to be: since
  # the repository is public, electron-builder.yml uses `provider: github` and
  # electron-updater reads the installers and the latest*.yml feeds straight
  # from this Release. A self-hosted mirror stays possible (deploy/README.md),
  # it is just no longer what keeps installed apps up to date.
  electron:
    name: electron — installers (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sim/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      # `--publish never`: electron-builder does write latest.yml /
      # latest-linux.yml (electron-builder.yml's `publish` configuration is
      # enough to generate them) but attempts no upload. The upload is the
      # explicit `gh release upload` step below — one code path for every
      # asset, rather than two tools racing to attach files to the same
      # Release.
      - name: electron-builder
        run: npx electron-builder --publish never

      - name: Attach the installers to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # `latest.yml` (Windows) and `latest-linux.yml` (Linux): each OS only
          # produces one of the two. A glob (not a literal name) is needed so
          # that nullglob elides the missing one instead of passing it verbatim
          # to `gh release upload`, which would fail to open it.
          files=(release/*.AppImage release/*.exe release/*.blockmap release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::electron-builder produced no installer"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${files[@]}"
