# Publication d'une version (issue #257).
#
# Déclenché par le push d'un tag `vX.Y.Z` (suffixe pre-release optionnel,
# `vX.Y.Z-beta`) — celui que `npm run release` a créé.
# Le job refuse de publier si le tag et sim/package.json ne disent pas le même
# numéro : c'est le garde-fou contre un tag posé à la main sur le mauvais commit.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sim/package-lock.json

      - name: Le tag et sim/package.json disent la même version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} contre version ${pkg} dans sim/package.json"
            exit 1
          fi

      - run: npm ci

      - name: Selftests, les mêmes qu'en CI
        run: npm run selftest:ci

      - name: Build du sim
        run: npm run build

      - name: Notes de version, reprises du CHANGELOG
        run: node tools/release-notes.mjs "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      # L'archive que deploy/deploy.sh installe sur le VPS. `dist` seul ne
      # démarre pas : server/api.mjs importe tools/lib/*, tools/*.mjs et
      # src/geofence.js. Le serveur n'a en revanche besoin d'AUCUN paquet npm
      # (vérifié : il boote sans node_modules), donc rien n'est installé sur le
      # VPS — d'où l'absence de node_modules ici, volontaire.
      #
      # Le runtime Node voyage avec : fpvtp.service lance
      # /opt/fpvtp/current/node/bin/node, et une unité ProtectSystem=strict ne
      # doit pas dépendre de la version que la distribution du jour propose. On
      # prend EXACTEMENT celle qui vient de faire passer les selftests.
      - name: Archive du serveur, pour héberger une instance
        run: |
          set -euo pipefail
          v="$(node -p 'process.version')"
          stage="${RUNNER_TEMP}/bundle"
          mkdir -p "${stage}/app" "${stage}/node"
          cp -r server tools src package.json "${stage}/app/"
          cp -r dist "${stage}/app/"
          # Tout ce qu'il faut pour installer la chose sans revenir au dépôt :
          # l'unité systemd, le Caddyfile, deploy.sh et sa checklist humaine.
          cp -r ../deploy "${stage}/deploy"
          # L'AGPL demande que la licence accompagne le programme qu'on
          # distribue. Ce n'est pas décoratif : sans elle l'archive n'est pas
          # conforme.
          cp ../LICENSE "${stage}/LICENSE"
          curl -fsSL "https://nodejs.org/dist/${v}/node-${v}-linux-x64.tar.xz" -o "${RUNNER_TEMP}/node.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${stage}/node" --strip-components=1
          # Le runtime embarqué doit démarrer LE serveur, pas seulement
          # s'annoncer : on lui fait résoudre les chemins avant de sceller
          # l'archive. Une archive qui ne démarre pas ne doit pas être publiée.
          "${stage}/node/bin/node" --version
          "${stage}/node/bin/node" "${stage}/app/server/index.mjs" --help > /dev/null
          tar -czf "${RUNNER_TEMP}/fpvtp-server-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C "${stage}" app node deploy LICENSE

      # Ce que la Release contient, écrit dans son corps : sans ça personne ne
      # sait lequel des quatre fichiers télécharger.
      - name: Ajouter l'inventaire des fichiers aux notes
        run: |
          cat >> "${RUNNER_TEMP}/notes.md" <<'NOTES'

          ---

          ## Quel fichier télécharger

          | Fichier | Pour qui |
          |---|---|
          | `FPVTP-*-win-x64.exe` | **Jouer sous Windows.** Installeur : entrée Menu Démarrer, désinstalleur, mise à jour automatique. |
          | `FPVTP-*-linux-x86_64.AppImage` | **Jouer sous Linux.** Rendre exécutable, double-cliquer. |
          | `fpvtp-server-*-linux-x64.tar.gz` | **Héberger une instance.** Le serveur, le jeu construit, un runtime Node, et `deploy/` (unité systemd, Caddyfile, script de livraison, checklist). Aucun `npm install` à faire. |
          | `latest.yml` / `latest-linux.yml` | Les flux de mise à jour automatique. Ne pas télécharger à la main. |

          Héberger : décompresser, puis suivre `deploy/README.md`. Le serveur
          écoute sur `127.0.0.1` et refuse d'aller plus loin sans `--mode shared`,
          qui réclame alors une clé d'opérateur à chaque requête.

          Le jeu est sous [AGPL-3.0](LICENSE) : si vous en hébergez une version
          modifiée pour d'autres personnes, vous devez leur en publier les sources.
          NOTES

      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            "${RUNNER_TEMP}/fpvtp-server-${GITHUB_REF_NAME}-linux-x64.tar.gz"

  # L'app installée (issue #259, tranche T2). Chaque plateforme se construit sur
  # son propre runner : les binaires natifs (sharp/libvips) sont ceux du
  # système qui les installe, une compilation croisée depuis Linux embarquerait
  # les .so de Linux dans l'installeur Windows.
  #
  # Rien n'est déposé sur un serveur ici : héberger latest.yml et les
  # installeurs est la tranche T4. Les fichiers de flux sont attachés à la
  # Release pour que ce serveur n'ait plus qu'à les recopier.
  electron:
    name: app installée (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sim/package-lock.json

      - run: npm ci

      - name: Build du sim
        run: npm run build

      # `--publish never` : electron-builder écrit bien latest.yml /
      # latest-linux.yml (la configuration `publish` de electron-builder.yml
      # suffit à les générer) mais ne tente aucun envoi. La distribution est
      # celle de la Release, plus tard celle du VPS.
      - name: electron-builder
        run: npx electron-builder --publish never

      - name: Attacher les installeurs à la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # `latest.yml` (Windows) et `latest-linux.yml` (Linux) : chaque OS n'en
          # produit qu'un des deux. Un glob (pas un nom littéral) est nécessaire
          # pour que nullglob élide celui qui manque au lieu de le passer tel
          # quel à `gh release upload`, qui échouerait à l'ouvrir.
          files=(release/*.AppImage release/*.exe release/*.blockmap release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::electron-builder n'a produit aucun installeur"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${files[@]}"
