<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- The mark is a pixel grid: the hinted exports stay crisp where an SVG
	     resampled to 16 px would not. See docs/brand.md. -->
	<link rel="icon" type="image/png" sizes="16x16" href="/brand/png/fpvtp-icon-16.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/brand/png/fpvtp-icon-32.png">
	<link rel="icon" type="image/png" sizes="48x48" href="/brand/png/fpvtp-icon-48.png">
	<title>FPVThePlanet!</title>

	<!-- The card a link to a deployed instance unfurls into. og:url is
	     deliberately absent: deploy/ fixes no domain, and a wrong canonical URL
	     is worse than none. The image path is root-relative for the same reason
	     — scrapers resolve it against the page. Whoever pins a domain should add
	     og:url and make this absolute. See docs/brand.md. -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="FPVThePlanet!">
	<meta property="og:title" content="FPVThePlanet!">
	<meta property="og:description" content="Fly FPV over real cities, in the browser. The scenery is not modelled: it is 3D photogrammetry, the geometry and textures of a place that exists.">
	<meta property="og:image" content="/brand/fpvtp-og-1200x630.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="FPVThePlanet! — it's not a level, it's Tokyo.">
	<meta name="twitter:card" content="summary_large_image">

	<link rel="stylesheet" href="/src/style.css">
</head>
<body>
	<div id="ui"></div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
